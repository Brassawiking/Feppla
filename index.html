<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feppla JS</title>
  <link rel="stylesheet" href="docs/style.css">
</head>
<body>
  <div id="error"></div>
  <div id="app"></div>
  <script>
    window.addEventListener('error', (event) => {
      document.querySelector('#error').textContent = event.error
    })
  </script>
  <script type="module" src="docs/app.js"></script>
</body>
</html>
